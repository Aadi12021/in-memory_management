[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tiered-memory"
version = "0.2.0"
description = "A cognitive-science-grounded tiered memory system for AI agents: consolidation, decay, and salience-based retention."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Aditi Menon" }
]
keywords = ["memory", "agents", "llm", "cognitive-architecture", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
chroma = ["chromadb>=0.4.0"]
llm = ["anthropic>=0.30.0"]
percept = ["sentence-transformers>=2.2.0", "numpy>=1.24.0"]
dev = ["pytest>=7.0", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/Aadi12021/in-memory_management"
Issues = "https://github.com/Aadi12021/in-memory_management/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_system"]

[tool.pytest.ini_options]
testpaths = ["tests"]
